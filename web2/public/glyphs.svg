<!-- RollWatch custom glyphs. 24px grid, 1.5px stroke, square caps, currentColor.
     Use: <svg width="20" height="20"><use href="/glyphs.svg#rw-spike"/></svg>  Always pair with a text label. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="rw-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M7 22V10a5 5 0 0 1 10 0v12"/>
    <path d="M9.5 22v-5M14.5 22v-5" stroke-width="1"/>
    <path d="M12 4.5v6" stroke="#4C2A85" stroke-width="2.5"/>
  </symbol>
  <symbol id="rw-spike" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M2 21h20"/>
    <path d="M4 21v-3M7.5 21v-4M11 21v-3M18 21v-4M21 21v-3"/>
    <path d="M14.5 21V4" stroke-width="2"/>
  </symbol>
  <symbol id="rw-twins" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <rect x="2.5" y="5" width="13" height="8"/>
    <rect x="8.5" y="11" width="13" height="8"/>
    <path d="M5 9h6M11 15h7"/>
  </symbol>
  <symbol id="rw-crowd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M5 22V3h14v19"/>
    <g fill="currentColor" stroke="none">
      <circle cx="8.5" cy="7.5" r="1"/><circle cx="11" cy="7.5" r="1"/><circle cx="13.5" cy="7.5" r="1"/><circle cx="16" cy="7.5" r="1"/>
      <circle cx="8.5" cy="11" r="1"/><circle cx="11" cy="11" r="1"/><circle cx="13.5" cy="11" r="1"/><circle cx="16" cy="11" r="1"/>
      <circle cx="8.5" cy="14.5" r="1"/><circle cx="11" cy="14.5" r="1"/><circle cx="13.5" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/>
      <circle cx="8.5" cy="18" r="1"/><circle cx="11" cy="18" r="1"/><circle cx="13.5" cy="18" r="1"/><circle cx="16" cy="18" r="1"/>
    </g>
  </symbol>
  <symbol id="rw-age" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="1.5" y="6" width="21" height="12"/>
    <text x="12" y="15.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="currentColor" stroke="none">110+</text>
  </symbol>
  <symbol id="rw-mirror" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M3 5h6M3 9h5M3 13h6M3 17h4"/>
    <path d="M21 5h-6M21 9h-5M21 13h-6M21 17h-4"/>
    <path d="M12 2v20" stroke-dasharray="2 2"/>
  </symbol>
  <symbol id="rw-tally" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M6 4v16M10 4v16M14 4v16M18 4v16"/>
    <path d="M3 17L21 7"/>
  </symbol>
  <symbol id="rw-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
    <path d="M4 10v4M8 6v12M12 9v6M16 4v16M20 10v4"/>
  </symbol>
  <symbol id="rw-script" viewBox="0 0 24 24">
    <text x="0" y="16" font-family="Noto Sans Devanagari, sans-serif" font-size="7.5" fill="currentColor">अ</text>
    <text x="8" y="16" font-family="Noto Sans Gurmukhi, sans-serif" font-size="7.5" fill="currentColor">ਅ</text>
    <text x="17.5" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="7.5" font-weight="700" fill="currentColor">A</text>
  </symbol>
  <symbol id="rw-stamp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <g transform="rotate(-8 12 12)">
      <rect x="2.5" y="7" width="19" height="10"/>
      <rect x="4.5" y="9" width="15" height="6" stroke-width="0.75"/>
    </g>
  </symbol>
  <symbol id="rw-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
  </symbol>
  <symbol id="rw-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/>
  </symbol>
</svg>
