# Keeps the free Render services awake during the event (they sleep after 15 idle minutes).
# Does nothing after 29 Oct 2026, so it never burns free instance hours afterwards. Delete it after the event.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping web and API
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261029 ]; then echo "event over, skipping"; exit 0; fi
          for u in https://rollwatch-api.onrender.com/health https://rollwatch-web.onrender.com/; do
            curl -s -o /dev/null -w "$u %{http_code} %{time_total}s\n" -m 120 "$u" || true
          done
