# docker compose up --build  ->  API on http://localhost:8000 (POST /audit for draft rolls)
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "${DEMO_MODE:-0}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - ./artifacts:/app/artifacts
      - ./cache:/app/cache
      - ./cards:/app/cards
    restart: unless-stopped
